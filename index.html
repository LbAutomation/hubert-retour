<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Rien ne part d'ici : ni requête, ni ressource externe, et l'adresse n'est transmise à personne. -->
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Hubert – dernière étape</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; background: #f6f6f4; color: #1d1d1b; }
  main { max-width: 440px; margin: 6vh auto; background: #fff; border-radius: 18px; padding: 26px 22px; box-shadow: 0 2px 14px rgba(0,0,0,.07); }
  h1 { font-size: 24px; margin: 0 0 18px; }
  ol { padding-left: 22px; margin: 0 0 18px; font-size: 18px; line-height: 1.5; }
  button, a.bouton { display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 16px; font-size: 18px; font-weight: 600; border-radius: 14px; border: 0; margin: 12px 0; text-decoration: none; }
  button { background: #1d1d1b; color: #fff; }
  a.bouton { background: #2aabee; color: #fff; }
  textarea { position: absolute; left: -9999px; }
  p.note { color: #6b6b66; font-size: 14px; margin: 16px 0 0; }
</style>
</head>
<body>
<main id="ok">
  <h1>✅ Miele a accepté. Plus qu'une étape.</h1>
  <ol>
    <li>Appuie sur <b>Copier</b>.</li>
    <li>Appuie sur <b>Ouvrir Telegram</b>, et colle le texte dans ta conversation avec Hubert.</li>
  </ol>
  <button id="copier" type="button">Copier</button>
  <a class="bouton" href="https://t.me/hubert_ia_bot">Ouvrir Telegram</a>
  <p class="note">Hubert te répondra « Miele est connecté ».</p>
  <textarea id="adresse" readonly></textarea>
</main>
<script>
  // Page de retour de la connexion Miele de Hubert : elle garde seulement l'adresse reçue,
  // dont le code ne sert qu'une fois et ne vaut rien sans le secret du serveur.
  var adresse = location.href;
  var champ = document.getElementById("adresse");
  champ.value = adresse;
  var params = new URLSearchParams(location.search);
  if (params.get("error")) {
    document.querySelector("h1").textContent = "⚠️ Miele a refusé la connexion.";
    document.querySelector("ol").innerHTML = "<li>Appuie sur <b>Copier</b>.</li><li>Envoie le texte à Hubert : il te dira pourquoi.</li>";
  } else if (!params.get("code")) {
    document.getElementById("ok").innerHTML = "<h1>Rien à faire ici</h1><p>Cette page sert seulement à la fin d'une connexion demandée par Hubert.</p>";
  }
  var bouton = document.getElementById("copier");
  if (bouton) bouton.addEventListener("click", function () {
    var fini = function () { bouton.textContent = "Copié ✓  Ouvre Telegram et colle"; };
    var secours = function () { champ.select(); document.execCommand("copy"); fini(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(adresse).then(fini, secours);
    else secours();
  });
</script>
</body>
</html>
